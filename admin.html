<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Liftly Admin</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .admin-hero{padding:18px;border-radius:12px;background:linear-gradient(180deg,#fff,#fffaf3);box-shadow:var(--shadow);margin-bottom:18px}
      .user-list{padding:0;margin:0;list-style:none}
      .user-list li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(15,23,42,0.04)}
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand"><div class="logo">L</div><div class="brand-name">liftly</div></div>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/payments.html">Billing</a>
          <button id="signOut" class="button secondary">Sign out</button>
        </nav>
      </header>

      <main>
        <section class="admin-hero">
          <div class="row" style="justify-content:space-between;align-items:center">
            <div>
              <h2>Admin — Users</h2>
              <p class="small">View and manage registered users. Passwords are never exposed.</p>
            </div>
            <div class="row">
              <button id="devEnable" class="button">Enable Dev Admin (Norway)</button>
            </div>
          </div>
        </section>

        <section>
          <ul id="users" class="user-list"></ul>
        </section>
      </main>
    </div>

    <script>
      async function fetchUsers(){
        try{
          const res = await fetch('/api/admin/users');
          if (!res.ok){ const b = await res.json(); alert(b.error || 'Unauthorized'); return; }
          const users = await res.json();
          const el = document.getElementById('users'); el.innerHTML = '';
          users.forEach(u=>{
            const li = document.createElement('li');
            li.innerHTML = `<div><strong>${u.name}</strong><div class="small">${u.email} • ${u.signupAt}</div></div><div><span class="tag">${u.plan}</span></div>`;
            el.appendChild(li);
          });
        }catch(e){ console.error(e); alert('Unable to load users'); }
      }

      document.getElementById('devEnable').addEventListener('click', async ()=>{
        try{
          const res = await fetch('/api/admin/enable', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:'Norway' }) });
          const b = await res.json(); if (!res.ok) return alert(b.error||'Failed'); alert(b.message || 'Enabled'); fetchUsers();
        }catch(e){ console.error(e); alert('Unable to enable dev admin'); }
      });

      document.getElementById('signOut').addEventListener('click', async ()=>{
        await fetch('/api/auth/logout', { method:'POST' }); location.href = '/';
      });

      // Initial load
      fetchUsers();
    </script>
  </body>
</html>
